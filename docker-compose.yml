services:
  db:
    image: mysql:8.4
    container_name: asistente-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: asistente-api
    env_file: .env
    environment:
      MYSQL_HOST: db
      # Ollama corre en tu máquina (fuera de Docker); así lo ve el contenedor
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DOCS_DIR: /code/docs
      CHROMA_DIR: /code/chroma_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docs:/code/docs:ro
      - ./chroma_data:/code/chroma_data
      - ./evals:/code/evals   # los resultados de las evals quedan en tu carpeta
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
